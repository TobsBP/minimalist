services:
  postgres:
    image: postgres:16
    container_name: minimalist_db
    environment:
      POSTGRES_DB: minimalist_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minimalist_net

  back-app:
    build:
      context: ./back-app
      dockerfile: Dockerfile
    container_name: minimalist_back
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/minimalist_store
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: mysecretkey
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - minimalist_net

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: minimalist_web
    environment:
      NEXT_PUBLIC_API_URL: http://back-app:8080
    ports:
      - "3000:3000"
    depends_on:
      back-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - minimalist_net

  e2e:
    build:
      context: ./web-app
      dockerfile: Dockerfile
      target: tester
    container_name: minimalist_e2e
    environment:
      BASE_URL: http://minimalist_web:3000
      CI: "true"
    depends_on:
      web-app:
        condition: service_started
    networks:
      - minimalist_net
    profiles:
      - test

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.Jenkins
    container_name: minimalist_jenkins
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - minimalist_net

  notifier:
    build:
      context: ./notify
      dockerfile: Dockerfile.notifier
    container_name: minimalist_notifier
    depends_on:
      postgres:
        condition: service_healthy 
      back-app:
        condition: service_healthy
      web-app:
        condition: service_healthy
    environment:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: gab.alves.pereira30@gmail.com
      SMTP_PASS: bvmkxfiexehcqrws
      EMAIL_FROM: gab.alves.pereira30@gmail.com
      EMAIL_TO: gab.alves.pereira30@gmail.com
      EMAIL_SUBJECT: Minimalist Store — ambiente no ar!
      DOCKER_HOST:   unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - minimalist_net
    restart: "no"
volumes:
  postgres_data:
  jenkins_data:

networks:
  minimalist_net:
    name: minimalist_net
    driver: bridge
    attachable: true
